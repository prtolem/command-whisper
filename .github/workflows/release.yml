name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: command-whisper-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Import stable signing identity
        env:
          LOCAL_SIGNING_P12: ${{ secrets.LOCAL_SIGNING_P12 }}
          LOCAL_SIGNING_PASSWORD: ${{ secrets.LOCAL_SIGNING_PASSWORD }}
        run: |
          mkdir -p work
          KEYCHAIN_PATH="$GITHUB_WORKSPACE/work/cw-build.keychain-db"
          printf '%s' "$LOCAL_SIGNING_P12" | /usr/bin/base64 -D > work/command-whisper-signing.p12
          printf '%s' "$LOCAL_SIGNING_PASSWORD" > work/command-whisper-signing-password
          security create-keychain -p "$LOCAL_SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$LOCAL_SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security import work/command-whisper-signing.p12 -f pkcs12 -k "$KEYCHAIN_PATH" -P "$LOCAL_SIGNING_PASSWORD" -T /usr/bin/codesign
          openssl pkcs12 -in work/command-whisper-signing.p12 -clcerts -nokeys -passin "pass:$LOCAL_SIGNING_PASSWORD" -out work/command-whisper-signing.crt
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain work/command-whisper-signing.crt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$LOCAL_SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Test and package
        run: |
          ./scripts/test.sh
          ./scripts/package-release.sh

      - name: Build signed Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p feed
          cp "outputs/Command-Whisper-${APP_VERSION}.zip" feed/
          printf '# Command Whisper %s\n\nАвтоматическая сборка стабильного релиза.\n' "$APP_VERSION" > "feed/Command-Whisper-${APP_VERSION}.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | work/Sparkle-2.10.0/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/prtolem/command-whisper/releases/download/${GITHUB_REF_NAME}/" \
            --embed-release-notes \
            feed

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "outputs/Command-Whisper-${APP_VERSION}.zip" \
            "outputs/Command-Whisper-${APP_VERSION}.dmg" \
            "feed/appcast.xml" \
            --title "Command Whisper ${APP_VERSION}" \
            --generate-notes
